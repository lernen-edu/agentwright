title: Agentwright
description: A 12-month, lab-driven agentic-engineering course from zero coding experience to deploying always-on, value-generating AI systems. Free on macOS. Lernen-edu.
url: https://agentwright.lernen.dev
baseurl: ""

remote_theme: just-the-docs/just-the-docs@v0.12.0

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 2
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s\-/]+/
  rel_url: true
  button: false

# Mermaid (the course has ~68 diagrams across 12 months)
mermaid:
  version: "10.6.1"

# Color scheme — student can toggle in the UI
color_scheme: light

# Show on every page
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Footer
last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"
gh_edit_link: false

# Files and dirs Jekyll should not process
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .githooks/
  - .tutor/

# Markdown / Liquid
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Plugins (all on the GitHub Pages allowlist)
plugins:
  - jekyll-relative-links     # rewrites *.md links to *.html on the rendered site
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-remote-theme       # required for remote_theme

relative_links:
  enabled: true
  collections: true
